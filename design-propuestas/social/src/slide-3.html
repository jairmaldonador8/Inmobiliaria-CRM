<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; font-family:Poppins,sans-serif; background:linear-gradient(150deg,#F5F1E8 0%,#F3DCC2 32%,#EBBF9A 62%,#DFA987 100%); position:relative; }
  .orbe1 { position:absolute; width:640px; height:640px; border-radius:50%; background:radial-gradient(circle,rgba(201,138,59,0.38),transparent 70%); top:-160px; right:-160px; }
  .orbe2 { position:absolute; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle,rgba(163,78,40,0.22),transparent 70%); bottom:-100px; left:-160px; }
  .cont { position:relative; padding:96px 90px; height:100%; display:flex; flex-direction:column; }
  .titulo { font-size:66px; font-weight:600; text-transform:uppercase; color:#221B14; line-height:1.16; }
  .titulo em { font-style:normal; color:#6B4A33; }
  .telefono { margin:64px auto 0; width:560px; border-radius:56px; border:14px solid #221B14; background:linear-gradient(150deg,#F5F1E8,#EBBF9A); padding:56px 30px 40px; box-shadow:0 50px 90px rgba(60,42,26,0.35); }
  .glass { border-radius:28px; border:2px solid rgba(255,255,255,0.85); background:rgba(250,247,241,0.7); box-shadow:0 16px 44px rgba(107,74,51,0.22); padding:26px; }
  .glass .etq { font-size:15px; text-transform:uppercase; letter-spacing:2.5px; color:#6B5D4E; }
  .glass .num { font-size:52px; font-weight:700; color:#221B14; }
  .glass .num span { font-size:20px; color:#65A30D; font-weight:600; }
  .fila { display:flex; gap:16px; margin-top:16px; }
  .mini { flex:1; border-radius:22px; border:2px solid rgba(255,255,255,0.85); background:rgba(250,247,241,0.66); padding:20px; box-shadow:0 10px 26px rgba(107,74,51,0.14); }
  .mini .etq { font-size:12px; text-transform:uppercase; letter-spacing:2px; color:#6B5D4E; }
  .mini .num { font-size:38px; font-weight:700; color:#221B14; }
  .mini .num.alerta { color:#A34E28; }
  .tinta { margin-top:16px; border-radius:22px; background:rgba(34,27,20,0.92); padding:22px 26px; display:flex; justify-content:space-between; align-items:center; }
  .tinta .etq { font-size:13px; text-transform:uppercase; letter-spacing:2.5px; color:#C9B896; }
  .tinta .num { font-size:36px; font-weight:700; color:#F2EDE4; }
  .tinta .cta { background:#C98A3B; color:#221B14; font-size:15px; font-weight:700; padding:10px 22px; border-radius:999px; }
  .pie { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-size:26px; letter-spacing:0.24em; text-transform:uppercase; color:#6B4A33; }
</style></head>
<body>
  <div class="orbe1"></div><div class="orbe2"></div>
  <div class="cont">
    <div class="titulo">El CRM que tu equipo<br><em>sí va a usar</em></div>
    <div class="telefono">
      <div class="glass">
        <div class="etq">Leads · 30 días</div>
        <div class="num">24 <span>▲ 12%</span></div>
        <svg width="100%" height="120" viewBox="0 0 460 120" preserveAspectRatio="none">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C98A3B" stop-opacity="0.32"/><stop offset="100%" stop-color="#C98A3B" stop-opacity="0"/></linearGradient></defs>
          <path d="M0,95 C36,86 60,102 92,78 C124,54 148,70 190,50 C232,30 262,46 308,26 C354,10 396,32 460,12 L460,120 L0,120 Z" fill="url(#g)"/>
          <path d="M0,95 C36,86 60,102 92,78 C124,54 148,70 190,50 C232,30 262,46 308,26 C354,10 396,32 460,12" fill="none" stroke="#C98A3B" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="fila">
        <div class="mini"><div class="etq">Sin atender</div><div class="num alerta">3</div></div>
        <div class="mini"><div class="etq">Citas hoy</div><div class="num">5</div></div>
      </div>
      <div class="tinta"><div><div class="etq">Cierres del mes</div><div class="num">7</div></div><div class="cta">Ver leads</div></div>
    </div>
    <div class="pie"><span>KLO–SER</span><span>03 / 05</span></div>
  </div>
</body></html>
