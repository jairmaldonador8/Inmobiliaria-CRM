<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#221B14; font-family:Poppins,sans-serif; color:#F2EDE4; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:100px; }
  .wordmark { font-family:Jost,sans-serif; font-weight:200; font-size:88px; letter-spacing:0.44em; display:flex; align-items:center; margin-left:0.44em; }
  .wordmark .guion { display:inline-block; width:62px; height:9px; background:#C98A3B; margin:0 18px; border-radius:2px; }
  .claim { margin-top:34px; font-size:30px; font-weight:300; letter-spacing:0.30em; text-transform:uppercase; color:#C9B896; }
  .pronto { margin-top:120px; font-size:110px; font-weight:600; text-transform:uppercase; line-height:1.05; color:#C98A3B; }
  .sub { margin-top:36px; font-size:32px; font-weight:300; color:#E7DCC8; max-width:700px; line-height:1.5; }
  .regla { width:120px; height:3px; background:#C98A3B; margin-top:90px; }
  .sigue { margin-top:36px; font-size:26px; letter-spacing:0.26em; text-transform:uppercase; color:#8E7F68; }
</style></head>
<body>
  <div class="wordmark">KLO<span class="guion"></span>SER</div>
  <div class="claim">Del lead al cierre</div>
  <div class="pronto">Muy<br>pronto</div>
  <div class="sub">El CRM inmobiliario que se construye como tus cierres: con oficio.</div>
  <div class="regla"></div>
  <div class="sigue">Síguenos para el lanzamiento</div>
</body></html>
