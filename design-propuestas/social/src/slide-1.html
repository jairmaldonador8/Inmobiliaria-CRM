<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:Poppins,sans-serif; }
  .foto { position:absolute; inset:0; background:url('file:///C:/Users/bykai/OneDrive/Documents/GitHub/Inmobiliaria-CRM/design-propuestas/assets/mood-01.jpg') center/cover; }
  .velo { position:absolute; inset:0; background:linear-gradient(180deg, rgba(34,27,20,0.08) 0%, rgba(34,27,20,0.0) 40%, rgba(34,27,20,0.55) 100%); }
  .contenido { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between; padding:90px 80px; }
  .wordmark { font-family:Jost,sans-serif; font-weight:200; font-size:64px; letter-spacing:0.44em; color:#F2EDE4; display:flex; align-items:center; }
  .wordmark .guion { display:inline-block; width:46px; height:7px; background:#C98A3B; margin:0 14px; border-radius:2px; }
  .abajo { color:#F2EDE4; }
  .claim { font-weight:600; font-size:86px; line-height:1.12; text-transform:uppercase; letter-spacing:0.01em; max-width:850px; }
  .claim em { font-style:normal; color:#E3B778; }
  .pill { display:inline-block; margin-top:44px; border:3px solid #F2EDE4; border-radius:999px; padding:18px 42px; font-size:30px; letter-spacing:0.28em; text-transform:uppercase; font-weight:400; }
</style></head>
<body>
  <div class="foto"></div><div class="velo"></div>
  <div class="contenido">
    <div class="wordmark">KLO<span class="guion"></span>SER</div>
    <div class="abajo">
      <div class="claim">Un buen cierre<br><em>se construye</em></div>
      <div class="pill">Muy pronto</div>
    </div>
  </div>
</body></html>
