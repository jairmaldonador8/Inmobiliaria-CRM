<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; overflow:hidden; position:relative; font-family:Poppins,sans-serif; background:linear-gradient(150deg,#F5F1E8 0%,#F3DCC2 32%,#EBBF9A 62%,#DFA987 100%); }
  .orbe1 { position:absolute; width:680px; height:680px; border-radius:50%; background:radial-gradient(circle,rgba(201,138,59,0.38),transparent 70%); top:-180px; right:-180px; }
  .orbe2 { position:absolute; width:540px; height:540px; border-radius:50%; background:radial-gradient(circle,rgba(163,78,40,0.22),transparent 70%); bottom:-120px; left:-160px; }
  .cont { position:relative; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:110px 90px; }
  .wordmark { font-family:Jost,sans-serif; font-weight:200; font-size:72px; letter-spacing:0.44em; color:#221B14; display:flex; align-items:center; }
  .wordmark .guion { display:inline-block; width:52px; height:8px; background:#6B4A33; margin:0 16px; border-radius:2px; }
  .centro { }
  .claim { font-weight:600; font-size:96px; line-height:1.12; text-transform:uppercase; color:#221B14; }
  .claim em { font-style:normal; color:#6B4A33; }
  .glass { display:inline-block; margin-top:56px; border-radius:24px; border:2px solid rgba(255,255,255,0.85); background:rgba(250,247,241,0.68); box-shadow:0 16px 44px rgba(107,74,51,0.22); padding:26px 42px; font-size:32px; font-weight:300; color:#5A4B3C; }
  .glass strong { font-weight:600; color:#221B14; }
  .abajo { display:flex; justify-content:space-between; align-items:center; }
  .pill { border:3px solid #6B4A33; color:#6B4A33; border-radius:999px; padding:18px 44px; font-size:30px; letter-spacing:0.28em; text-transform:uppercase; font-weight:400; }
  .num { font-size:26px; letter-spacing:0.24em; color:#8E7F68; }
</style></head>
<body>
  <div class="orbe1"></div><div class="orbe2"></div>
  <div class="cont">
    <div class="wordmark">KLO<span class="guion"></span>SER</div>
    <div class="centro">
      <div class="claim">Un buen cierre<br><em>se construye</em></div>
      <div class="glass">El CRM inmobiliario <strong>del lead al cierre</strong></div>
    </div>
    <div class="abajo"><span class="pill">Muy pronto</span><span class="num">01 / 05</span></div>
  </div>
</body></html>
