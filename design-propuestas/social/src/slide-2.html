<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1350px; background:#F2EDE4; font-family:Poppins,sans-serif; color:#221B14; padding:100px 90px; display:flex; flex-direction:column; }
  .regla { height:3px; background:#221B14; }
  .titulo { font-size:76px; font-weight:600; text-transform:uppercase; line-height:1.15; margin:56px 0; }
  .titulo em { font-style:normal; color:#6B4A33; }
  .lista { margin-top:30px; display:flex; flex-direction:column; }
  .item { display:flex; align-items:baseline; gap:34px; padding:44px 0; border-top:2px solid rgba(34,27,20,0.25); }
  .num { font-size:34px; font-weight:300; color:#C98A3B; min-width:60px; }
  .item p { font-size:40px; font-weight:300; line-height:1.35; }
  .item strong { font-weight:600; }
  .pie { margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-size:26px; letter-spacing:0.24em; text-transform:uppercase; color:#6B4A33; }
</style></head>
<body>
  <div class="regla"></div>
  <div class="titulo">Los leads no se pierden.<br><em>Se construyen.</em></div>
  <div class="lista">
    <div class="item"><span class="num">01</span><p><strong>Los leads llegan solos</strong> desde tus portales — nadie los captura a mano.</p></div>
    <div class="item"><span class="num">02</span><p><strong>Cada asesor sabe qué le toca hoy</strong> — y su teléfono le avisa al instante.</p></div>
    <div class="item"><span class="num">03</span><p><strong>La dirección lo ve todo</strong> sin pedir un solo reporte.</p></div>
  </div>
  <div class="pie"><span>KLO–SER</span><span>02 / 05</span></div>
</body></html>
